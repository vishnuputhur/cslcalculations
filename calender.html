<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>CSL Calendar</title>
    <meta name="theme-color" content="#0F172A">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-21G1BS7S3S"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-21G1BS7S3S');
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #F8FAFC;
            --header-bg: #0F172A;
            --primary: #2563EB;
            --primary-light: #EFF6FF;
            --holiday-text: #E11D48;
            --holiday-bg: #FFF1F2;
            --holiday-border: #FECDD3;
            --green-week-bg: #F0FDF4;
            --green-week-border: #BBF7D0;
            --today-bg: #FEF3C7;
            --today-border: #F59E0B;
            --today-text: #B45309;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            font-size: 14px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Header with Year Dropdown */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 58px;
            background: var(--header-bg);
            color: #FFFFFF;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .today-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .today-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Year Selector Pill */
        .year-selector-wrapper {
            position: relative;
        }

        .year-select {
            appearance: none;
            -webkit-appearance: none;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: #FFFFFF;
            border: none;
            padding: 6px 28px 6px 14px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
            outline: none;
        }

        .year-selector-wrapper::after {
            content: '▾';
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #FFFFFF;
            font-size: 12px;
            pointer-events: none;
        }
        
        /* Calendar Container */
        .calendar-container {
            margin-top: 66px;
            padding: 0 8px 70px;
            max-width: 760px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .month-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 14px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
            border: 1px solid var(--border-color);
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 6px;
        }

        .month-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.2px;
        }

        .month-year-tag {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 2px 8px;
            border-radius: 6px;
        }
        
        /* Strict 7 equal columns */
        .week-header {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
            padding: 4px 0;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .week-header .sun-label {
            color: var(--holiday-text);
        }
        
        .week {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
            margin-bottom: 3px;
        }
        
        .day {
            background: #FFFFFF;
            color: var(--text-dark);
            cursor: pointer;
            position: relative;
            border-radius: 10px;
            height: 48px;
            width: 100%;
            min-width: 0;
            padding: 5px 2px 3px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            border: 1px solid transparent;
            overflow: hidden;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        
        .day:hover {
            border-color: #CBD5E1;
            transform: translateY(-1px);
        }
        
        .day.green-week {
            background: var(--green-week-bg);
            border-color: var(--green-week-border);
        }
        
        .day.sunday, .day.holiday {
            color: var(--holiday-text) !important;
            background: var(--holiday-bg) !important;
            border-color: var(--holiday-border) !important;
        }
        
        .day.today {
            background: var(--today-bg) !important;
            color: var(--today-text) !important;
            border: 2px solid var(--today-border) !important;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
        }
        
        .empty-day {
            background: transparent !important;
            border: none !important;
            cursor: default;
            pointer-events: none;
        }
        
        .day-number {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.1;
            margin-top: 2px;
        }

        .holiday-label {
            font-size: 7.5px;
            font-weight: 700;
            line-height: 1.1;
            margin-top: 3px;
            width: 100%;
            padding: 0 2px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
            opacity: 0.9;
        }
        
        .note-indicator {
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            position: absolute;
            top: 4px;
            right: 4px;
        }

        /* Popup Modal */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            z-index: 1500;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFFFFF;
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
            z-index: 2000;
            width: 90%;
            max-width: 340px;
            animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes popIn {
            from { opacity: 0; transform: translate(-50%, -46%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .popup h3 {
            color: var(--text-dark);
            font-size: 17px;
            font-weight: 800;
            line-height: 1.3;
        }

        .popup h3.is-holiday {
            color: var(--holiday-text);
        }
        
        .date-badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 12px;
        }
        
        .popup textarea {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-main);
            color: var(--text-dark);
            font-size: 14px;
            resize: none;
            margin-bottom: 14px;
            font-family: inherit;
            min-height: 85px;
            transition: border-color 0.2s;
        }
        
        .popup textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #FFFFFF;
        }
        
        .popup-buttons {
            display: flex;
            gap: 10px;
        }
        
        .popup button {
            padding: 11px 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            flex: 1;
            transition: transform 0.15s;
        }

        .popup button:active {
            transform: scale(0.97);
        }
        
        .save-btn {
            background: var(--primary);
            color: #FFFFFF;
        }
        
        .close-btn {
            background: #F1F5F9;
            color: var(--text-muted);
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            color: var(--text-muted);
            padding: 10px;
            text-align: center;
            z-index: 1000;
            font-size: 11px;
            font-weight: 600;
            border-top: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">CSL Calendar</div>
        <div class="header-actions">
            <button class="today-btn" onclick="jumpToToday()">Today</button>
            <div class="year-selector-wrapper">
                <select id="year-select" class="year-select" onchange="changeYear(this.value)" aria-label="Select Year">
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closePopup()"></div>
    <div class="calendar-container" id="calendar-container"></div>
    <div class="popup" id="holiday-popup"></div>
    <div class="footer" id="footer-text">VT@Soft | Version 3.0 | © 2026</div>

    <script>
        // Declared Holidays for CSL Kochi (2026 & 2027)
        const holidays = {
            // 2025 Dec
            "2025-12-25": "Christmas Day",
            
            // 2026 Holidays
            "2026-01-26": "Republic Day",
            "2026-03-20": "Id-ul-Fitr (Ramzan)",
            "2026-04-03": "Good Friday",
            "2026-04-15": "Vishu",
            "2026-05-01": "May Day",
            "2026-05-27": "Id-ul-Ad'ha (Bakrid)",
            "2026-08-15": "Independence Day",
            "2026-08-26": "Thiruvonam",
            "2026-08-28": "Fourth Onam",
            "2026-10-02": "Gandhi Jayanthi",
            "2026-10-21": "Vijayadasami",
            "2026-12-25": "Christmas",

            // 2027 Holidays (Office Order No. PERL/152/2026)
            "2027-01-26": "Republic Day",
            "2027-03-06": "Maha Sivarathri",
            "2027-03-10": "Id-ul-Fitr (Ramzan)",
            "2027-03-25": "Maundy Thursday",
            "2027-03-26": "Good Friday",
            "2027-04-15": "Vishu",
            "2027-05-01": "May Day",
            "2027-05-17": "Id-ul-Ad'ha (Bakrid)",
            "2027-09-13": "Third Onam",
            "2027-09-15": "Sree Narayana Guru Jayanthi",
            "2027-10-02": "Gandhi Jayanthi",
            "2027-10-28": "Deepavali",
            "2027-12-25": "Christmas",

            // 2028 Standard National Holidays
            "2028-01-26": "Republic Day",
            "2028-08-15": "Independence Day",
            "2028-10-02": "Gandhi Jayanthi",
            "2028-12-25": "Christmas"
        };

        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        const today = new Date();
        const currentRealYear = today.getFullYear();

        // Update Footer Year Automatically based on Current Date
        document.getElementById('footer-text').textContent = `VT@Soft | Version 3.0 | © ${currentRealYear}`;

        let selectedYear = [2026, 2027, 2028].includes(currentRealYear) ? currentRealYear : 2026;

        function getISOWeek(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
            const week1 = new Date(d.getFullYear(), 0, 4);
            return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        }

        // Returns 2nd and 4th Saturdays of a month
        function getSpecialSaturdays(year, monthIndex) {
            const specialSats = [];
            const saturdays = [];
            for (let day = 1; day <= 31; day++) {
                const date = new Date(year, monthIndex, day);
                if (date.getMonth() !== monthIndex) break;
                if (date.getDay() === 6) {
                    saturdays.push(day);
                }
            }
            if (saturdays.length >= 2) specialSats.push(saturdays[1]);
            if (saturdays.length >= 4) specialSats.push(saturdays[3]);
            return specialSats;
        }

        function generateCalendar(year) {
            let calendarHTML = '';

            for (let month = 0; month < 12; month++) {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const specialSaturdays = getSpecialSaturdays(year, month);

                calendarHTML += `
                    <div class="month-card" id="month-${year}-${month}">
                        <div class="month-header">
                            <span class="month-title">${monthNames[month]}</span>
                            <span class="month-year-tag">${year}</span>
                        </div>
                        <div class="week-header">
                            <div class="sun-label">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                        </div>
                `;

                let date = 1;
                for (let i = 0; i < 6; i++) {
                    if (date > daysInMonth) break;
                    calendarHTML += `<div class="week">`;
                    for (let j = 0; j < 7; j++) {
                        if ((i === 0 && j < firstDay) || date > daysInMonth) {
                            calendarHTML += '<div class="day empty-day"></div>';
                        } else {
                            const currentDate = new Date(year, month, date);
                            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                            const isoWeek = getISOWeek(currentDate);
                            const isSunday = j === 0;
                            const isSpecialSaturday = (j === 6 && specialSaturdays.includes(date));
                            const holidayName = holidays[dateStr];
                            const isHoliday = Boolean(holidayName) || isSunday || isSpecialSaturday;
                            const isGreenWeek = (isoWeek % 2 === 0) && !isHoliday;

                            let classes = 'day';
                            if (isGreenWeek) classes += ' green-week';
                            if (isSunday) classes += ' sunday';
                            if (holidayName || isSpecialSaturday) classes += ' holiday';
                            if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === date) {
                                classes += ' today';
                            }

                            const savedNote = localStorage.getItem("note_" + dateStr);
                            const noteIndicator = savedNote ? '<div class="note-indicator"></div>' : '';
                            
                            let subLabel = '';
                            if (holidayName) {
                                subLabel = `<div class="holiday-label">${holidayName}</div>`;
                            }

                            calendarHTML += `
                                <div class="${classes}" onclick="showHoliday('${dateStr}', ${isSpecialSaturday}, ${isSunday})">
                                    <div class="day-number">${date}</div>
                                    ${subLabel}
                                    ${noteIndicator}
                                </div>`;
                            date++;
                        }
                    }
                    calendarHTML += '</div>';
                }
                calendarHTML += `</div>`;
            }
            document.getElementById('calendar-container').innerHTML = calendarHTML;
        }

        function changeYear(year) {
            selectedYear = parseInt(year, 10);
            generateCalendar(selectedYear);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function jumpToToday() {
            const targetYear = [2026, 2027, 2028].includes(currentRealYear) ? currentRealYear : 2026;
            
            document.getElementById('year-select').value = targetYear;
            selectedYear = targetYear;
            generateCalendar(selectedYear);

            const monthElement = document.getElementById(`month-${targetYear}-${today.getMonth()}`);
            if (monthElement) {
                setTimeout(() => {
                    const yOffset = -70;
                    const y = monthElement.getBoundingClientRect().top + window.pageYOffset + yOffset;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }, 80);
            }
        }

        function showHoliday(dateStr, isSpecialSaturday, isSunday) {
            const popup = document.getElementById('holiday-popup');
            const overlay = document.getElementById('overlay');
            const note = localStorage.getItem("note_" + dateStr) || "";
            
            let title = holidays[dateStr];
            let isHolidayTitle = true;

            if (!title) {
                if (isSpecialSaturday) {
                    title = "2nd / 4th Saturday Holiday";
                } else if (isSunday) {
                    title = "Sunday Holiday";
                } else {
                    title = "Add Personal Note";
                    isHolidayTitle = false;
                }
            }

            const [y, m, d] = dateStr.split('-');
            const formattedDate = `${d} ${monthNames[parseInt(m, 10) - 1]} ${y}`;

            popup.innerHTML = `
                <div class="popup-header">
                    <h3 class="${isHolidayTitle ? 'is-holiday' : ''}">${title}</h3>
                </div>
                <div class="date-badge">${formattedDate}</div>
                <textarea id="note-input" placeholder="Write a reminder or note for this day...">${note}</textarea>
                <div class="popup-buttons">
                    <button class="close-btn" onclick="closePopup()">Cancel</button>
                    <button class="save-btn" onclick="saveNote('${dateStr}')">Save Note</button>
                </div>
            `;
            popup.style.display = 'block';
            overlay.style.display = 'block';
        }

        function saveNote(dateStr) {
            const note = document.getElementById("note-input").value.trim();
            if (note) {
                localStorage.setItem("note_" + dateStr, note);
            } else {
                localStorage.removeItem("note_" + dateStr);
            }
            closePopup();
            generateCalendar(selectedYear);
        }

        function closePopup() {
            document.getElementById("holiday-popup").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePopup();
        });

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year-select').value = selectedYear;
            jumpToToday();
        });
    </script>
</body>
</html>
